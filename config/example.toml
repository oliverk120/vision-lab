# Design example only; no application or loader exists in Milestone 0.
schema_version = 1

[source]
kind = "file"
path = "data/phone-recording.mp4" # Placeholder; do not commit recordings.

[replay]
mode = "paced"
speed = 1.0
loop = false

[cache]
retention_seconds = 600

[streams.a]
width = 64
height = 64
color = "gray"
fps = 15.0
resize = "letterbox"

[streams.b]
width = 320
height = 320
color = "rgb"
fps = 1.0
resize = "letterbox"
