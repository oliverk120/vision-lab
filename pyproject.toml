[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vision-lab"
version = "0.1.0"
description = "Timestamp-aware computer vision experimentation workbench"
requires-python = ">=3.12,<3.13"
dependencies = ["av>=16,<18", "numpy>=2,<3", "opencv-python-headless>=4.11,<5", "streamlit>=1.45,<2", "pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/vision_lab"]
